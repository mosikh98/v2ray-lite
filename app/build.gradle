plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lite.xray'
    compileSdk 34

    defaultConfig {
        applicationId "com.lite.xray"
        minSdk 26
        targetSdk 34
        // CI run number keeps versionCode increasing so every build installs as an update
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            // key + password come from GitHub Secrets (see .github/workflows/build.yml); nothing secret is in the repo
            storeFile file("release.p12")
            storeType "pkcs12"
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "xraylite"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            // xray runs as an executable from nativeLibraryDir -> must be extracted
            useLegacyPackaging = true
            keepDebugSymbols.add('**/*.so')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
