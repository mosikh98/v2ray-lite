name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch Xray-core (latest release, android arm64)
        run: |
          mkdir -p /tmp/xray app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          unzip -o /tmp/xray.zip xray -d /tmp/xray
          cp /tmp/xray/xray app/src/main/jniLibs/arm64-v8a/libxray.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libxray.so
          TAG=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/XTLS/Xray-core/releases/latest | sed 's|.*/tag/||' || true)
          echo "XRAY_TAG=${TAG:-latest}" >> "$GITHUB_ENV"

      - name: Build tun2socks (hev-socks5-tunnel + our JNI shim)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          HEV=native/jni/hev-socks5-tunnel
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel "$HEV"

          # which entry point does this hev version export?
          if grep -rqs "hev_socks5_tunnel_main_from_file" "$HEV/src"; then
            M=hev_socks5_tunnel_main_from_file
          else
            M=hev_socks5_tunnel_main
          fi
          echo "entry point: $M"
          grep -rn "hev_socks5_tunnel_quit" "$HEV/src" | head -5 || true

          # replace upstream JNI glue with ours
          FILES=$(find "$HEV" -name hev-jni.c)
          echo "jni files: $FILES"
          test -n "$FILES"
          for f in $FILES; do
            sed "s/@HEV_MAIN@/$M/g" native/hev-jni.c.in > "$f"
          done

          "$NDK/ndk-build" -C native
          cp native/libs/arm64-v8a/libhev-socks5-tunnel.so app/src/main/jniLibs/arm64-v8a/
          # sanity: our symbols must be exported
          NM=$(find "$NDK" -name llvm-nm -type f | head -1)
          "$NM" -D app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so | grep Java_com_lite_xray_Tun || echo "WARNING: JNI symbols not found by nm"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key (from GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_B64 and KEYSTORE_PASSWORD are missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.p12

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/*.apk "XrayLite-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: XrayLite-apk
          path: XrayLite-v1.0.${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: XrayLite v1.0.${{ github.run_number }}
          files: XrayLite-v1.0.${{ github.run_number }}.apk
          generate_release_notes: true
          body: |
            **XrayLite build ${{ github.run_number }}**
            - Xray-core: `${{ env.XRAY_TAG }}`
            - Android 8.0+ / arm64-v8a
            - Signed with the project key: installs as an update over the previous build.
